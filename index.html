<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Template Studio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>🎬 Video Template Studio</h1>
        <p>Monte seus Reels em lote diretamente no navegador.</p>
      </div>
      <span class="badge">MP4 • 1080×1920 • 9:16</span>
    </header>

    <section class="grid">
      <aside class="panel controls">
        <h2>1. Template</h2>
        <div id="templateList" class="templates"></div>

        <h2>2. Perfil</h2>
        <label>Nome do perfil
          <input id="profileInput" value="@fitnamente" maxlength="40">
        </label>

        <label>Logo (opcional)
          <input id="logoInput" type="file" accept="image/png,image/jpeg,image/webp">
        </label>

        <h2>3. Vídeos</h2>
        <label class="upload">
          <input id="videoInput" type="file" accept="video/*" multiple>
          <span>＋ Adicionar vídeos</span>
        </label>
        <div id="videoCount" class="muted">Nenhum vídeo selecionado.</div>

        <button id="generateBtn" class="primary">GERAR VÍDEOS</button>
        <button id="downloadBtn" class="secondary" disabled>BAIXAR TODOS (.ZIP)</button>
        <div id="status" class="status">Pronto.</div>
        <progress id="progress" value="0" max="100"></progress>
      </aside>

      <section class="panel preview-panel">
        <h2>Pré-visualização</h2>
        <div class="phone">
          <canvas id="previewCanvas" width="540" height="960"></canvas>
        </div>
        <p class="muted">A prévia usa o primeiro vídeo selecionado.</p>
      </section>
    </section>

    <section class="panel results">
      <h2>Vídeos gerados</h2>
      <div id="results"></div>
    </section>
  </main>

  <!-- FFmpeg.wasm e JSZip -->
  <script src="vendor/ffmpeg/ffmpeg.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <script src="js/templates.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
